name: Release PR

# The branch picked under "Use workflow from" is the one merged into main:
# develop for a release, a hotfix branch for a hotfix.
on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE: ${{ github.ref_name }}

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the source branch
        run: |
          if [[ "$SOURCE" == "main" ]]; then
            echo "Error: the source cannot be main itself."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$SOURCE" >/dev/null; then
            echo "Error: there is no branch named '$SOURCE'."
            exit 1
          fi

      # The range comes from the branches, not from the previous release PR,
      # so the first run and any hand-made merge into main need nothing special.
      - name: Build the description
        id: body
        run: |
          COMMITS=$(git log --no-merges --reverse --format='- %s (%h)' "origin/main..origin/$SOURCE")
          if [[ -z "$COMMITS" ]]; then
            echo "Nothing on $SOURCE that main does not already have."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "Everything on \`$SOURCE\` that is not yet on \`main\`."
            echo
            echo "## Commits"
            echo
            echo "$COMMITS"
          } > "$RUNNER_TEMP/body.md"
          echo "empty=false" >> "$GITHUB_OUTPUT"

      # A PR opened with GITHUB_TOKEN does not trigger CI, so this uses RELEASE_TOKEN.
      - name: Open or update the release PR
        if: steps.body.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TITLE="Hotfix $SOURCE ($(date -u +%Y-%m-%d))"
          if [[ "$SOURCE" == "develop" ]]; then
            TITLE="Merge Develop ($(date -u +%Y-%m-%d))"
          fi
          EXISTING=$(gh pr list --base main --head "$SOURCE" --state open --json number --jq '.[0].number')

          # A push to develop only keeps an open release PR's commit list current. It
          # opens nothing, and leaves the title and auto-merge as a person set them.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ -n "$EXISTING" ]]; then
              gh api -X PATCH "repos/${{ github.repository }}/pulls/$EXISTING" \
                -F body=@"$RUNNER_TEMP/body.md" --jq '.html_url'
            fi
            exit 0
          fi

          if [[ -n "$EXISTING" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/pulls/$EXISTING" \
              -f title="$TITLE" -F body=@"$RUNNER_TEMP/body.md" --jq '.html_url'
            PR="$EXISTING"
          else
            PR=$(gh pr create --base main --head "$SOURCE" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
          fi

          # A merge commit, never squash or rebase: those copy the source's commits
          # under new ids, and the next run would list every one of them again.
          gh pr merge "$PR" --auto --merge ||
            echo "::warning::Could not turn on auto-merge. Is it allowed in the repo settings?"
